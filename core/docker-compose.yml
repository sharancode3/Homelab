services:
  postgres:
    image: postgres:16
    container_name: homelab-postgres
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: homelab-minio
    restart: unless-stopped

    env_file:
      - .env

    command: server /data --console-address ":9001"

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

  auth-service:
    build: ../auth-service
    container_name: homelab-auth
    restart: unless-stopped

    env_file:
      - ../auth-service/.env

    ports:
      - "8000:8000"

    depends_on:
      - postgres

  caddy:
    image: caddy:2
    container_name: homelab-caddy
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile

    depends_on:
      - auth-service

volumes:
  postgres_data:
  minio_data: