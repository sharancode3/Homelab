[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "homelab-sdk"
version = "0.1.0"
description = "Python SDK for Homelab BaaS Platform"
authors = [
    {name = "Homelab", email = "developer@homelab.local"}
]
dependencies = [
    "requests>=2.31.0",
    "pydantic>=2.0.0"
]
requires-python = ">=3.10"

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "responses>=0.23.0"
]
